<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --sauce: #b8321f;  --sauce-dark: #8f2214;   /* tomato sauce */
    --crust: #6b4a32;  --crust-dark: #523823;   /* crust brown */
    --cheese: #f3c24a;                          /* melted cheese */
    --cream: #fbf4e4;  --paper: #fffdf7;
    --ink: #3a2418;    --muted: #7a6552;  --line: #e4d4b4;
    --up: #1f7a2e;     --down: #c62828;  --offer: #8a5200;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }   /* so display rules below never override the hidden attribute */
  body { margin: 0; background: var(--cream); color: var(--ink); line-height: 1.45;
         font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Georgian", sans-serif; }

  /* red-and-white checked tablecloth */
  .band { height: 24px; background-color: #fff; border-bottom: 3px solid var(--sauce);
          background-image: linear-gradient(90deg, rgba(184,50,31,.5) 50%, transparent 50%), linear-gradient(rgba(184,50,31,.5) 50%, transparent 50%);
          background-size: 24px 24px; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  header.brand { text-align: center; padding: 6px 0 20px; }
  header.brand h1 { font-family: "Pacifico", Georgia, serif; font-weight: 400; font-size: 2.5rem; margin: 0; color: var(--sauce); }
  header.brand p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; letter-spacing: .04em; }

  /* menu-card panels */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 18px;
          box-shadow: 0 2px 0 var(--line), 0 10px 22px rgba(90,50,20,.08); }
  #restView .card, #results.card { outline: 1px dashed var(--line); outline-offset: -9px; }

  button { font: inherit; font-weight: 600; padding: 10px 20px; border: 0; border-radius: 999px; background: var(--sauce); color: #fff; cursor: pointer; transition: background .15s, transform .05s; }
  button:hover:not(:disabled) { background: var(--sauce-dark); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { background: #cdbca4; cursor: default; }
  button.secondary { background: var(--crust); }
  button.secondary:hover:not(:disabled) { background: var(--crust-dark); }
  button.danger { background: #7f1d1d; }
  button.danger:hover:not(:disabled) { background: #5f1414; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--cheese); outline-offset: 2px; }

  .topbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .dl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
  .dl select { max-width: 280px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  nav button { background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); padding: 8px 18px; }
  nav button:not(.active):hover:not(:disabled) { background: #f6e6c4; }
  nav button.active { background: var(--sauce); color: #fff; border-color: var(--sauce); }

  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-bottom: 14px; }
  .row label { display: flex; flex-direction: column; font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); gap: 5px; }
  select, input[type=text], input[type=date], input[type=password], td input {
    font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  input[type=file] { font: inherit; max-width: 100%; }
  input[type=file]::file-selector-button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 9px 18px; margin-right: 12px; background: var(--cheese); color: var(--ink); cursor: pointer; }
  input[type=file]::file-selector-button:hover { background: #e9b432; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px; vertical-align: top; }
  th { font-size: .75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 6px 4px; }
  td input { width: 100%; padding: 7px 9px; }
  td input.bad, td select.bad { border-color: var(--down); background: #fdecea; }
  td select.assumed { border-color: #d89a00; background: #fff6dc; }
  #results table { min-width: 880px; }
  #results td:nth-child(1) { min-width: 96px; } #results td:nth-child(2) { min-width: 84px; } #results td:nth-child(3) { min-width: 120px; } #results td:nth-child(4) { min-width: 130px; } #results td:nth-child(7) { min-width: 110px; }
  #results td, #results th { padding-left: 3px; padding-right: 3px; }
  #results td input[type=text], #results td select { padding: 7px 7px; }
  #results td button { padding: 8px 13px; }
  td select { width: 100%; padding: 7px 9px; }
  tr.group td { background: #f8e7bd; font-weight: 700; padding: 10px 12px; border-left: 5px solid var(--sauce); border-radius: 6px; }

  #status { margin-top: 10px; min-height: 1.2em; }
  .err { color: #b3261e; font-weight: 600; } .ok { color: #2e7d32; font-weight: 600; }
  .scroll { overflow-x: auto; }
  .muted { color: var(--muted); }

  /* restaurant price grid */
  #restTitle { font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem; color: var(--sauce); margin: 0 12px 0 0 !important; }
  .grid { border-collapse: separate; border-spacing: 0; }
  .grid thead th { background: var(--sauce); color: #fff; font-size: .9rem; text-transform: none; letter-spacing: 0; padding: 11px 14px; }
  .grid thead th:first-child { border-top-left-radius: 10px; } .grid thead th:last-child { border-top-right-radius: 10px; }
  .grid td { padding: 13px 14px; border-bottom: 1px solid var(--line); }
  .grid tbody tr:nth-child(even) td { background: #fdf7e8; }
  .grid tbody tr:hover td { background: #fbeccb; }
  .grid td strong { font-size: 1.08rem; }
  .grid.single td:nth-child(2) { white-space: nowrap; }
  .grid.single .note { font-size: .85rem; }
  .grid s { color: var(--muted); margin-left: 8px; font-size: .9rem; }
  .grid .note { font-size: .8rem; font-weight: 600; color: var(--offer); margin-top: 2px; }
  .chg { margin-left: 8px; font-size: .85rem; font-weight: 700; white-space: nowrap; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); }
  .pop { display: inline-block; margin-top: 5px; padding: 2px 9px; border-radius: 999px; background: var(--cheese); color: var(--ink); font-size: .72rem; font-weight: 700; letter-spacing: .03em; }
  .pop.new { background: #2f6b3a; color: #fff; }
  .pop.age { background: #7f1d1d; color: #fff; }
  .pop + .pop { margin-left: 6px; }
  td.c { text-align: center; vertical-align: middle; }
  td input[type=checkbox] { width: 20px; height: 20px; padding: 0; accent-color: var(--sauce); cursor: pointer; }
  .legend { font-size: .85rem; color: var(--muted); margin: 12px 0 0; }

  /* Glovo / Wolt switch inside a restaurant */
  .seg { display: inline-flex; gap: 4px; padding: 4px; background: #f1e4c8; border-radius: 999px; }
  .seg button { background: transparent; color: var(--ink); padding: 7px 20px; }
  .seg button:not(.active):hover:not(:disabled) { background: #f6e6c4; }
  .seg button.active { background: var(--crust); color: #fff; }
  .seg button.active:hover:not(:disabled) { background: var(--crust-dark); }

  /* login */
  #login { max-width: 380px; margin: 28px auto; text-align: center; }
  #login p { margin: 0 0 16px; color: var(--muted); }
  #login label { display: flex; flex-direction: column; gap: 6px; text-align: left; font-weight: 700; margin-bottom: 14px; }
  #login input, #login button { width: 100%; }
  #loginMsg { margin-top: 12px; }

  @media (max-width: 600px) {
    .wrap { padding: 12px; } .card { padding: 14px; } header.brand h1 { font-size: 2rem; }
    .topbar { justify-content: center; } #restTitle { font-size: 1.5rem; }
    .grid thead th, .grid td { padding: 9px 6px; }
    .grid td:first-child { min-width: 78px; max-width: 105px; }
    .grid td strong { font-size: .95rem; } .grid .note { font-size: .74rem; }
    .chg { white-space: normal; margin-left: 3px; font-size: .78rem; } .grid s { margin-left: 3px; font-size: .82rem; }
  }
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap">
<header class="brand">
  <h1>🍕 Price Tracker</h1>
  <p>Fresh menu prices, served daily</p>
</header>

<div class="card" id="login">
  <p>Enter the password to come on in.</p>
  <label>Password <input type="password" id="pw"></label>
  <button id="loginBtn">Enter</button>
  <div id="loginMsg" class="err"></div>
</div>

<div id="app" hidden>
  <div class="topbar">
    <nav id="tabs"></nav>
    <div class="dl">
      <select id="dlScope" aria-label="What to download"></select>
      <button class="secondary" id="dlBtn">⬇ Download Excel</button>
      <span id="dlStatus" class="muted"></span>
    </div>
  </div>

  <!-- ADD TAB -->
  <section id="addView">
    <div class="card">
      <div class="row">
        <label>Restaurant
          <select id="rest"></select>
        </label>
        <label id="newRestWrap" hidden>New restaurant name
          <input type="text" id="newRest">
        </label>
        <label>Platform
          <select id="platform"></select>
        </label>
        <label>Date of these prices
          <input type="date" id="date">
        </label>
      </div>
      <div class="row">
        <input type="file" id="files" accept="image/*" multiple>
        <button id="readBtn">Read screenshots</button>
      </div>
      <div id="status"></div>
    </div>

    <div class="card" id="results" hidden>
      <div class="scroll">
        <table>
          <thead><tr><th>Restaurant</th><th>Platform</th><th>Item</th><th>Headline</th><th>Sale price</th><th>Regular price</th><th>Offer</th><th>Popular</th><th>New</th><th>18+</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p>
        <button id="saveBtn">Save prices</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </p>
    </div>
  </section>

  <!-- RESTAURANT TAB -->
  <section id="restView" hidden>
    <div class="card">
      <div class="row">
        <h2 id="restTitle" style="margin:0"></h2>
        <div class="seg" id="platTabs"></div>
      </div>
      <div class="row" id="dateRow">
        <label>Date
          <select id="dateSel"></select>
        </label>
        <label>Headline
          <select id="headSel"></select>
        </label>
        <button class="danger" id="delDateBtn">Delete this date</button>
      </div>
      <p id="platEmpty" class="muted" hidden></p>
      <div class="scroll" id="gridWrap"><table class="grid" id="grid"></table></div>
      <p class="legend" id="legend"><span class="chg up">▲</span> price went up, <span class="chg down">▼</span> price went down, compared with the last earlier date this pizza was recorded under the same headline.</p>
    </div>
  </section>
</div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const FIELDS = ["restaurant", "platform", "item", "size", "sale_price", "regular_price", "notes", "popular", "isNew", "age18"];
const PLATFORMS = ["Glovo", "Wolt"];   // keep in sync with lib/platforms.js
const platformLabel = (p) => p || "No platform";   // older entries saved before platforms existed
const NEW = "__new";
let password = sessionStorage.getItem("pw") || "";
let data = [];          // rows read but not yet sent (shared across devices)
let history = [];       // saved price history
let view = "add";       // "add" or a restaurant name
let chosenDate = {};    // restaurant|platform -> date being shown
let chosenPlatform = {}; // restaurant -> Glovo / Wolt tab being shown
let chosenHeadline = {}; // restaurant|platform -> headline being shown (or "__all")
let showBad = false;
let saveTimer = null;
let pickedNew = false;   // true only when the user deliberately chose "New restaurant"

const key = (s) => String(s ?? "").trim().toLowerCase();
function today() {
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function numOf(v) {
  let s = String(v ?? "").replace(/[^\d.,]/g, "");
  if (!s) return NaN;
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, "");
  else s = s.replace(",", ".");
  return parseFloat(s);
}
const money = (v) => (typeof v === "number" ? v.toFixed(2) : String(v)) + "₾";   // display only; stored values are plain numbers
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
// "2026-11-03" -> "3rd November 2026" (values stay ISO underneath so sorting still works)
function niceDate(iso) {
  const [y, m, d] = String(iso).split("-").map(Number);
  if (!y || !m || !d) return String(iso);
  const suffix = d % 100 >= 11 && d % 100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[d % 10] || "th");
  return `${d}${suffix} ${MONTHS[m - 1]} ${y}`;
}
function setStatus(msg, cls) { $("status").textContent = msg; $("status").className = cls || ""; }

function backToLogin(msg) {
  password = ""; sessionStorage.removeItem("pw");
  $("app").hidden = true; $("login").hidden = false; $("loginMsg").textContent = msg;
}

async function api(name, body) {
  const res = await fetch(`/.netlify/functions/${name}`, {
    method: "POST",
    headers: { "content-type": "application/json", "x-site-password": encodeURIComponent(password) },
    body: JSON.stringify(body)
  });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401) { backToLogin("Wrong password. Please try again."); throw new Error("Wrong password"); }
  if (!res.ok) throw new Error(out.error || `Error ${res.status}`);
  return out;
}

// Shrink screenshots so uploads stay under Netlify's 6MB request limit.
// Median brightness (0 = black, 255 = white) of a screenshot, measured on a tiny copy of it.
// The background covers most of a menu page, so the median follows it, not the food photos.
function medianBrightness(canvas) {
  try {
    const t = document.createElement("canvas"); t.width = t.height = 48;
    const ctx = t.getContext("2d"); ctx.drawImage(canvas, 0, 0, 48, 48);
    const px = ctx.getImageData(0, 0, 48, 48).data, lum = [];
    for (let i = 0; i < px.length; i += 4) lum.push(0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]);
    lum.sort((a, b) => a - b);
    return lum[Math.floor(lum.length / 2)];
  } catch { return NaN; }
}
// Your screenshots: Wolt is taken with a dark background, Glovo with a light one. Change here if that ever changes.
const THEME = { dark: "Wolt", light: "Glovo" };
function platformFromBrightness(b) {
  if (!(b >= 0)) return "";
  if (b < 100) return THEME.dark;
  if (b > 155) return THEME.light;
  return "";   // in between: not clearly dark or light, so do not guess
}

function shrink(file, max = 1800) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * scale; c.height = img.height * scale;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve({ image: c.toDataURL("image/jpeg", 0.85).split(",")[1], brightness: medianBrightness(c) });
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- start-up, tabs ---------- */
function showApp() {
  $("login").hidden = true; $("app").hidden = false;
  $("date").value = today();
  const ps = $("platform");   // "Auto-detect" first, then each app
  if (!ps.options.length) {
    [["auto", `Auto (dark = ${THEME.dark}, light = ${THEME.light})`], ...PLATFORMS.map((p) => [p, p])].forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; ps.appendChild(o); });
    ps.value = lastPlatform || "auto";   // start on the app you used last
  }
  renderTabs(); fillRestaurantSelect();
  loadPending(); loadHistory();
}
$("loginBtn").onclick = async () => {
  password = $("pw").value.trim(); $("loginMsg").textContent = ""; $("loginBtn").disabled = true;
  try { await api("pending", { action: "load" }); sessionStorage.setItem("pw", password); showApp(); }   // check the password before opening the app
  catch (e) { if (e.message !== "Wrong password") $("loginMsg").textContent = e.message; }
  $("loginBtn").disabled = false;
};
$("pw").onkeydown = (e) => { if (e.key === "Enter") $("loginBtn").click(); };

const restaurantsSaved = () => [...new Set(history.map((r) => r.restaurant))].sort((a, b) => a.localeCompare(b));

function renderTabs() {
  const nav = $("tabs"); nav.innerHTML = "";
  const add = (label, v) => {
    const b = document.createElement("button");
    b.textContent = label; b.className = view === v ? "active" : "";
    b.onclick = () => { view = v; $("dlScope").value = "all"; delete chosenPlatform[v]; Object.keys(chosenDate).forEach((k) => { if (k.startsWith(v + "|")) delete chosenDate[k]; }); Object.keys(chosenHeadline).forEach((k) => { if (k.startsWith(v + "|")) delete chosenHeadline[k]; }); renderTabs(); showView(); };   // opening a tab always starts on the newest date
    nav.appendChild(b);
  };
  add("➕ Add", "add");
  restaurantsSaved().forEach((r) => add(r, r));
}
function showView() {
  $("addView").hidden = view !== "add";
  $("restView").hidden = view === "add";
  if (view !== "add") renderRestaurant(); else refreshDownloadScopes();
}

// What the Download button includes: everything, or (on a restaurant tab) just that restaurant, or just the day shown.
function refreshDownloadScopes() {
  const options = [["all", "Everything"]];
  if (view !== "add") {
    options.push(["restaurant", `${view}: all dates, both apps`]);
    const plat = chosenPlatform[view], d = chosenDate[view + "|" + plat];
    if (d) options.push(["day", `${view} · ${platformLabel(plat)} · ${niceDate(d)}`]);
  }
  const sel = $("dlScope"), prev = sel.value;
  sel.innerHTML = "";
  options.forEach(([v, t]) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); });
  sel.value = options.some(([v]) => v === prev) ? prev : "all";
}

function fillRestaurantSelect() {
  const sel = $("rest"), prev = sel.value;
  const names = [...new Set([...restaurantsSaved(), ...data.map((r) => r.restaurant).filter(Boolean)])];
  sel.innerHTML = "";
  names.forEach((n) => { const o = document.createElement("option"); o.value = n; o.textContent = n; sel.appendChild(o); });
  const o = document.createElement("option"); o.value = NEW; o.textContent = "➕ New restaurant…"; sel.appendChild(o);
  // Keep the current choice, but don't stay on "New restaurant" just because the list was empty at start-up.
  const keep = [...sel.options].some((x) => x.value === prev) && !(prev === NEW && !pickedNew && names.length);
  sel.value = keep ? prev : sel.options[0].value;
  $("newRestWrap").hidden = sel.value !== NEW;
}
$("rest").onchange = () => { pickedNew = $("rest").value === NEW; $("newRestWrap").hidden = !pickedNew; };
const chosenRestaurant = () => ($("rest").value === NEW ? $("newRest").value.trim() : $("rest").value);

/* ---------- saved history ---------- */
async function loadHistory() {
  try { history = (await api("history", { action: "read" })).rows; }
  catch (e) { setStatus("Could not load saved prices: " + e.message, "err"); }
  if (view !== "add" && !restaurantsSaved().includes(view)) view = "add";
  renderTabs(); fillRestaurantSelect(); showView();
}

// After saving, make sure the saved rows really show up. If the server has not caught up yet, ask again a few times.
async function loadHistoryUntilSeen(rows) {
  const seen = () => rows.every((r) => history.some((h) =>
    key(h.restaurant) === key(r.restaurant) && (h.platform || "") === r.platform && h.date === r.date &&
    key(h.size) === key(r.size) && key(h.item) === key(r.item)));
  for (let attempt = 0; attempt < 6; attempt++) {
    await loadHistory();
    if (seen()) return;
    await new Promise((resolve) => setTimeout(resolve, 1500 * (attempt + 1)));
  }
}

// Small tags under an item: "★ Popular", "New" and "18+", as the app shows them.
function tagsFor(r) {
  if (!r.popular && !r.isNew && !r.age18) return null;
  const box = document.createElement("div");
  if (r.popular) { const p = document.createElement("span"); p.className = "pop"; p.textContent = "★ Popular"; box.appendChild(p); }
  if (r.isNew) { const p = document.createElement("span"); p.className = "pop new"; p.textContent = "New"; box.appendChild(p); }
  if (r.age18) { const p = document.createElement("span"); p.className = "pop age"; p.textContent = "18+"; box.appendChild(p); }
  return box;
}

// One headline as its own table: item, price (with change arrow), regular price, offer.
function renderOneHeadline(grid, rows, before) {
  grid.className = "grid single";
  const head = grid.createTHead().insertRow();
  ["Item", "Price", "Regular price", "Offer"].forEach((h) => { const th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
  const body = grid.createTBody();
  const latest = new Map();
  rows.forEach((r) => latest.set(r.item, r));   // if a day was sent twice, the last one wins; order stays as read
  for (const r of latest.values()) {
    const tr = body.insertRow();
    const nameCell = tr.insertCell(); nameCell.textContent = r.item;
    const tags = tagsFor(r); if (tags) nameCell.appendChild(tags);
    const priceCell = tr.insertCell(), b = document.createElement("strong"); b.textContent = money(r.sale_price); priceCell.appendChild(b);
    const old = before.get(r.item + "\u0000" + r.size), diff = old ? numOf(r.sale_price) - numOf(old.sale_price) : 0;
    if (Math.abs(diff) >= 0.005) {
      const c = document.createElement("span");
      c.className = "chg " + (diff > 0 ? "up" : "down");
      c.textContent = (diff > 0 ? "▲ " : "▼ ") + Math.abs(diff).toFixed(2) + "₾";
      c.title = `was ${money(old.sale_price)} on ${niceDate(old.date)}`;
      priceCell.appendChild(c);
    }
    const regCell = tr.insertCell();
    if (r.regular_price !== "" && r.regular_price != null) { const o = document.createElement("s"); o.textContent = money(r.regular_price); regCell.appendChild(o); } else { regCell.textContent = "–"; regCell.className = "muted"; }
    const offerCell = tr.insertCell();
    if (r.notes) { const n = document.createElement("div"); n.className = "note"; n.textContent = r.notes; offerCell.appendChild(n); } else { offerCell.textContent = "–"; offerCell.className = "muted"; }
  }
}

function renderRestaurant() {
  const name = view;
  const everything = history.filter((r) => r.restaurant === name);
  $("restTitle").textContent = name;

  // Glovo and Wolt are always offered; any other value (older entries) only if it exists.
  const extra = [...new Set(everything.map((r) => r.platform || ""))].filter((p) => !PLATFORMS.includes(p));
  const platforms = [...PLATFORMS, ...extra];
  const newestOf = (p) => everything.filter((r) => (r.platform || "") === p).map((r) => r.date).sort().pop() || "";
  if (!platforms.includes(chosenPlatform[name]))   // open on the platform with the freshest prices
    chosenPlatform[name] = [...platforms].sort((a, b) => newestOf(b).localeCompare(newestOf(a)) || platforms.indexOf(a) - platforms.indexOf(b))[0];
  const plat = chosenPlatform[name];

  const seg = $("platTabs"); seg.innerHTML = "";
  platforms.forEach((p) => {
    const b = document.createElement("button");
    b.textContent = platformLabel(p); b.className = p === plat ? "active" : "";
    b.onclick = () => { chosenPlatform[name] = p; renderRestaurant(); };
    seg.appendChild(b);
  });

  const mine = everything.filter((r) => (r.platform || "") === plat);
  const dates = [...new Set(mine.map((r) => r.date))].sort().reverse();   // newest first
  const empty = !dates.length;
  $("dateRow").hidden = $("gridWrap").hidden = $("legend").hidden = empty;
  $("platEmpty").hidden = !empty;
  $("platEmpty").textContent = `No ${platformLabel(plat)} prices saved yet for ${name}.`;
  if (empty) { refreshDownloadScopes(); return; }

  const dKey = name + "|" + plat;
  const d = dates.includes(chosenDate[dKey]) ? chosenDate[dKey] : dates[0];
  chosenDate[dKey] = d;
  refreshDownloadScopes();

  const sel = $("dateSel"); sel.innerHTML = "";
  dates.forEach((x, i) => { const o = document.createElement("option"); o.value = x; o.textContent = niceDate(x) + (i === 0 ? " (newest)" : ""); sel.appendChild(o); });
  sel.value = d;

  const rows = mine.filter((r) => r.date === d);
  const sizes = [...new Set(rows.map((r) => r.size))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));   // one column per headline; 25 sorts before 33
  const pizzas = [...new Set(rows.map((r) => r.item))];
  const cell = new Map();
  rows.forEach((r) => cell.set(r.item + "\u0000" + r.size, r));   // if a day was sent twice, the last one wins
  // Most recent earlier record of each pizza+size ON THE SAME PLATFORM, for the ▲/▼ comparison.
  const before = new Map();
  mine.filter((r) => r.date < d).sort((a, b) => a.date.localeCompare(b.date))
    .forEach((r) => before.set(r.item + "\u0000" + r.size, r));

  // Headline dropdown: one headline's items (default), or every headline side by side.
  const ALL = "__all", hKey = name + "|" + plat;
  if (chosenHeadline[hKey] !== ALL && !sizes.includes(chosenHeadline[hKey])) chosenHeadline[hKey] = sizes[0];
  const hv = chosenHeadline[hKey];
  const hs = $("headSel"); hs.innerHTML = "";
  sizes.forEach((h) => { const o = document.createElement("option"); o.value = h; o.textContent = h; hs.appendChild(o); });
  const all = document.createElement("option"); all.value = ALL; all.textContent = "All headlines (side by side)"; hs.appendChild(all);
  hs.value = hv;

  const grid = $("grid"); grid.innerHTML = "";
  if (hv !== ALL) { renderOneHeadline(grid, rows.filter((r) => r.size === hv), before); return; }
  grid.className = "grid";
  const head = grid.createTHead().insertRow();
  ["Item", ...sizes].forEach((h) => { const th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
  const body = grid.createTBody();
  pizzas.forEach((p) => {
    const tr = body.insertRow();
    tr.insertCell().textContent = p;
    sizes.forEach((s) => {
      const td = tr.insertCell(), r = cell.get(p + "\u0000" + s);
      if (!r) { td.textContent = "–"; td.className = "muted"; return; }
      const b = document.createElement("strong"); b.textContent = money(r.sale_price); td.appendChild(b);
      const old = before.get(p + "\u0000" + s), diff = old ? numOf(r.sale_price) - numOf(old.sale_price) : 0;
      if (Math.abs(diff) >= 0.005) {
        const c = document.createElement("span");
        c.className = "chg " + (diff > 0 ? "up" : "down");
        c.textContent = (diff > 0 ? "▲ " : "▼ ") + Math.abs(diff).toFixed(2) + "₾";
        c.title = `was ${money(old.sale_price)} on ${niceDate(old.date)}`;
        td.appendChild(c);
      }
      if (r.regular_price !== "" && r.regular_price != null) { const o = document.createElement("s"); o.textContent = money(r.regular_price); td.appendChild(o); }
      if (r.notes) { const n = document.createElement("div"); n.className = "note"; n.textContent = r.notes; td.appendChild(n); }
      const tags = tagsFor(r); if (tags) td.appendChild(tags);
    });
  });
}
$("dateSel").onchange = () => { chosenDate[view + "|" + chosenPlatform[view]] = $("dateSel").value; renderRestaurant(); };
$("headSel").onchange = () => { chosenHeadline[view + "|" + chosenPlatform[view]] = $("headSel").value; renderRestaurant(); };

/* ---------- pending rows (shared via the server) ---------- */
async function loadPending() {
  try {
    data = (await api("pending", { action: "load" })).rows;
    render(); fillRestaurantSelect();
    if (data.length) setStatus(`${data.length} saved row(s) loaded.`, "ok");
  } catch (e) { setStatus("Could not load saved rows: " + e.message, "err"); }
}
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    try { await api("pending", { action: "save", rows: data }); }
    catch (e) { setStatus("Could not save rows: " + e.message, "err"); }
  }, 600);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !$("app").hidden && !saveTimer) { loadPending(); loadHistory(); }
});
// Leaving or refreshing the page: send any edit that is still waiting for its 0.6s timer right now.
function flushPending() {
  if (!saveTimer) return;
  clearTimeout(saveTimer); saveTimer = null;
  fetch("/.netlify/functions/pending", {
    method: "POST", keepalive: true,
    headers: { "content-type": "application/json", "x-site-password": encodeURIComponent(password) },
    body: JSON.stringify({ action: "save", rows: data })
  }).catch(() => {});
}
window.addEventListener("pagehide", flushPending);
document.addEventListener("visibilitychange", () => { if (document.hidden) flushPending(); });

function invalid(f, row) {
  if (f === "platform") return !PLATFORMS.includes(row.platform);
  if (f === "restaurant" || f === "item" || f === "size") return !String(row[f] ?? "").trim();
  if (f === "sale_price") return isNaN(numOf(row[f]));
  if (f === "regular_price") return String(row[f] ?? "").trim() !== "" && isNaN(numOf(row[f]));
  return false;
}

// Table grouped by restaurant + date. Rows keep their index in `data`.
function render() {
  const tbody = $("rows"); tbody.innerHTML = "";
  const groups = new Map();
  data.forEach((row, i) => {
    const k = key(row.restaurant) + "|" + (row.platform || "") + "|" + row.date;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(i);
  });
  [...groups.keys()].sort().forEach((k) => {
    const idxs = groups.get(k), first = data[idxs[0]];
    const h = document.createElement("tr"); h.className = "group";
    h.innerHTML = `<td colspan="11"></td>`;
    h.firstChild.textContent = `${first.restaurant.trim() || "(no restaurant)"} · ${first.platform || "(no platform)"} · ${niceDate(first.date)} · ${idxs.length} item${idxs.length > 1 ? "s" : ""}`;
    tbody.appendChild(h);
    idxs.forEach((i) => {
      const tr = document.createElement("tr");
      FIELDS.forEach((f) => {
        const td = document.createElement("td");
        let inp;
        if (f === "platform") {   // Glovo / Wolt picker instead of free text
          inp = document.createElement("select");
          PLATFORMS.forEach((p) => { const o = document.createElement("option"); o.value = o.textContent = p; inp.appendChild(o); });
          inp.value = data[i][f] || "";   // an unknown/empty value leaves it blank and gets flagged on save
          if (data[i].platformAssumed) inp.className = "assumed";   // a guess: yellow until you change it
          inp.onchange = () => { data[i][f] = inp.value; delete data[i].platformAssumed; if (inp.value) rememberPlatform(inp.value); persist(); render(); };   // regroup under the right platform
        } else if (f === "popular" || f === "isNew" || f === "age18") {   // tick boxes: the "Popular" / "New" / "18+" badges on the app
          td.className = "c";
          inp = document.createElement("input"); inp.type = "checkbox";
          inp.checked = data[i][f] === true;
          inp.onchange = () => { data[i][f] = inp.checked; persist(); };
        } else {
          inp = document.createElement("input");
          inp.value = data[i][f] ?? "";
          inp.oninput = () => { data[i][f] = inp.value; inp.classList.remove("bad"); persist(); };
          if (f === "restaurant") inp.onchange = () => { render(); fillRestaurantSelect(); };
        }
        inp.dataset.f = f;
        if (showBad && invalid(f, data[i])) inp.className = "bad";
        td.appendChild(inp); tr.appendChild(td);
      });
      const td = document.createElement("td"), x = document.createElement("button");
      x.textContent = "✕"; x.className = "secondary";
      x.onclick = () => { data.splice(i, 1); render(); persist(); $("results").hidden = !data.length; };
      td.appendChild(x); tr.appendChild(td);
      tbody.appendChild(tr);
    });
  });
  $("results").hidden = !data.length;
}

const isDup = (a) => data.some((r) =>
  key(r.restaurant) === key(a.restaurant) && r.platform === a.platform && r.date === a.date && key(r.size) === key(a.size) &&
  key(r.item) === key(a.item) && numOf(r.sale_price) === numOf(a.sale_price));

// The app you used last (detected with confidence, or picked by you). Used as a fallback when a
// screenshot shows nothing that identifies the app (for example a plain list of salads).
let lastPlatform = "";
try { const saved = localStorage.getItem("lastPlatform"); if (PLATFORMS.includes(saved)) lastPlatform = saved; } catch { /* private window: no memory, still works */ }
function rememberPlatform(p) { lastPlatform = p; try { localStorage.setItem("lastPlatform", p); } catch { /* ignore */ } }

$("readBtn").onclick = async () => {
  const restaurant = chosenRestaurant(), choice = $("platform").value, date = $("date").value, files = [...$("files").files];
  if (!restaurant) return setStatus("Choose or type the restaurant first.", "err");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return setStatus("Pick the date of these prices.", "err");
  if (!files.length) return setStatus("Choose at least one screenshot.", "err");
  $("readBtn").disabled = true;
  let added = 0, dups = 0, unreadable = 0, error = "";
  const results = [];   // what the reader returned for each screenshot
  try {
    for (let i = 0; i < files.length; i++) {
      setStatus(`Reading ${i + 1} of ${files.length}…`);
      const shot = await shrink(files[i]);
      const out = await api("extract", { image: shot.image, mediaType: "image/jpeg" });
      unreadable += out.unreadable || 0;
      results.push({ name: files[i].name, out, brightness: shot.brightness });
    }
  } catch (e) { error = e.message; }

  // Work out which app each screenshot belongs to.
  const detectedOf = (r) => platformFromBrightness(r.brightness);   // dark = Wolt, light = Glovo
  const found = [...new Set(results.map(detectedOf).filter(Boolean))];   // apps clearly identified by the background
  const seen = {}, unsure = [], assumed = {};
  let assumeReason = "";
  for (const result of results) {
    const { name, out } = result;
    const detected = detectedOf(result);
    let platform = "", guess = false;
    if (choice !== "auto") {                       // a platform you pick yourself always wins and is never second-guessed
      platform = choice;
    } else if (detected) {
      platform = detected; seen[detected] = (seen[detected] || 0) + 1;
    } else if (found.length === 1) {               // the other screenshots in this batch agree on one app
      platform = found[0]; guess = true; assumeReason = "same as the other screenshots";
    } else if (found.length === 0 && lastPlatform) {   // nothing identifies the app: use the one you used last
      platform = lastPlatform; guess = true; assumeReason = "same as your last batch";
    } else unsure.push(name);                      // mixed apps in one batch, or no clue at all: leave it blank
    if (guess) (assumed[platform] = assumed[platform] || []).push(name);
    for (const it of out.items) {
      const row = { restaurant, platform, date, item: it.item || "", size: it.size || "", sale_price: it.sale_price || "", regular_price: it.regular_price || "", notes: it.notes || "", popular: it.popular === true, isNew: it.isNew === true, age18: it.age18 === true };
      if (guess) row.platformAssumed = true;       // shown with a yellow outline until you confirm or change it
      if (isDup(row)) dups++; else { data.push(row); added++; }
    }
  }
  if (choice !== "auto") rememberPlatform(choice); else if (found.length) rememberPlatform(found[found.length - 1]);

  showBad = false; render(); fillRestaurantSelect(); persist();
  $("rest").value = restaurant; $("newRestWrap").hidden = $("rest").value !== NEW;
  const parts = [`Read ${added} item(s).`];
  if (choice !== "auto") parts.push(`Platform: ${choice}.`);
  if (Object.keys(seen).length) parts.push(`From the background colour (${THEME.dark} = dark, ${THEME.light} = light): ` + Object.entries(seen).map(([p, n]) => `${p} (${n} screenshot${n > 1 ? "s" : ""})`).join(", ") + ".");
  Object.entries(assumed).forEach(([p, names]) => parts.push(`⚠ Assumed ${p} for ${names.join(", ")} (${assumeReason}): check it in the table.`));
  if (unsure.length) parts.push(`⚠ Could not tell which app ${unsure.join(", ")} came from: choose the platform in the table.`);
  if (dups) parts.push(`${dups} repeated item(s) from overlapping screenshots were skipped.`);
  if (unreadable) parts.push(`⚠ ${unreadable} card(s) could not be read, so check the screenshot.`);
  if (error) parts.push("Stopped: " + error);
  else parts.push("Check the rows, then save them.");
  setStatus(parts.join(" "), error || unreadable || unsure.length || Object.keys(assumed).length ? "err" : "ok");
  $("readBtn").disabled = false;
};

$("saveBtn").onclick = async () => {
  if (!data.length) return setStatus("Nothing to send.", "err");
  showBad = true; render();
  if (data.some((r) => FIELDS.some((f) => invalid(f, r))))
    return setStatus("Fix the red cells (restaurant, platform, item, headline and sale price are required).", "err");
  $("saveBtn").disabled = true;
  try {
    clearTimeout(saveTimer); saveTimer = null;
    const justSaved = data;
    const { saved, replaced } = await api("save", { rows: data });
    data = []; showBad = false; render();
    setStatus(`Saved ${saved} price(s).` + (replaced ? ` ${replaced} replaced an earlier entry for the same restaurant, platform, date, headline and item.` : ""), "ok");
    await loadHistoryUntilSeen(justSaved);   // so the new prices and restaurant appear without a reload
  } catch (e) { setStatus(e.message, "err"); }
  $("saveBtn").disabled = false;
};

$("clearBtn").onclick = () => { data = []; showBad = false; render(); persist(); setStatus(""); };

$("delDateBtn").onclick = async () => {
  const name = view, plat = chosenPlatform[name], dKey = name + "|" + plat, d = chosenDate[dKey];
  if (d === undefined || !confirm(`Delete all ${name} (${platformLabel(plat)}) prices saved for ${niceDate(d)}? This cannot be undone.`)) return;
  try {
    await api("history", { action: "deleteDate", restaurant: name, platform: plat, date: d });
    delete chosenDate[dKey];
    await loadHistory();
    // If that platform has nothing left, jump to the one that still has prices instead of showing an empty page.
    if (view === name && !history.some((r) => r.restaurant === name && (r.platform || "") === plat)) { delete chosenPlatform[name]; renderRestaurant(); }
  } catch (e) { alert(e.message); }
};

$("dlBtn").onclick = async () => {
  $("dlBtn").disabled = true; $("dlStatus").textContent = "Preparing…"; $("dlStatus").className = "muted";
  try {
    const scope = $("dlScope").value, name = view, plat = chosenPlatform[name];
    const body = {};
    if (scope !== "all") body.restaurant = name;
    if (scope === "day") { body.platform = plat; body.date = chosenDate[name + "|" + plat]; }
    const fileName = scope === "all" ? `price-tracker-${today()}.xlsx`
      : `${name}${scope === "day" ? `-${platformLabel(plat)}-${body.date}` : ""}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
    const { base64 } = await api("export", body);
    const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    $("dlStatus").textContent = "Downloaded."; $("dlStatus").className = "ok";
  } catch (e) { $("dlStatus").textContent = e.message; $("dlStatus").className = "err"; }
  $("dlBtn").disabled = false;
};

if (password) showApp();
</script>
</body>
</html>
